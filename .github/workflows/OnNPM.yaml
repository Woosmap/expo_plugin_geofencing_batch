name: Publish Expo plugin - NPM Repo
'on':
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch: null
jobs:
  package_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for OIDC
    
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'
          always-auth: false
          token: ""

      # Debug: list all .npmrc files
      - run: |
          echo "Listing .npmrc files"
          find /home/runner -name ".npmrc" -print
          echo "---- contents ----"
          find /home/runner -name ".npmrc" -exec sh -c 'echo "---"; cat {}; echo "---"' \;
          
      - name: Capture plugin version
        run: |
          _pluginVersion=$(node -p "require('./package.json').version")
          echo "PLUGIN_VERSION=${_pluginVersion}" >> $GITHUB_ENV
          echo "new version : ${_pluginVersion}"
     
      - name: Collect dependencies
        run: |
          npm install
          npm run build
          
      - name: Publish
        run: |
          npm config list
          npm publish --provenance --access public --tag beta
        # env:
        #   NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
          
